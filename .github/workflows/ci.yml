name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Oxlint)
        run: bun run lint

      - name: Check formatting (Oxfmt)
        run: bun run format:check

      - name: Check documentation contracts
        run: bun run docs:check

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Build workspace
        run: bun run build

      - name: Validate publish manifests
        run: bun run release:check

      - name: Test workspace
        run: bun run test

  deploy-docs:
    name: Deploy documentation
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: docs-production
      cancel-in-progress: false
    environment:
      name: docs-production
      url: https://docs.openpromo.app
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build documentation
        run: bun run --cwd apps/docs build

      - name: Deploy documentation to Cloudflare
        run: bun run --cwd apps/docs wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
