name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# PR pushes cancel superseded runs instead of queueing; master pushes
# serialize without cancellation so an in-flight docs deploy is never cut off.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          # bun install caching is enabled by default in setup-bun@v2.
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: packages/*/.tsbuildinfo
          key: tsgo-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            tsgo-${{ runner.os }}-

      - name: Build workspace
        run: bun run build

      - name: Lint (Oxlint)
        run: bun run lint

      - name: Check formatting (Oxfmt)
        run: bun run format:check

      - name: Check documentation contracts
        run: bun run docs:check

      - name: Check generated SDK coverage ledgers
        run: bun run codegen:check

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Validate publish manifests
        run: bun run release:check

      - name: Test workspace
        run: bun run test

  deploy-docs:
    name: Deploy documentation
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: docs-production
      cancel-in-progress: false
    environment:
      name: docs-production
      url: https://docs.openpromo.app
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          # bun install caching is enabled by default in setup-bun@v2.
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build documentation
        run: bun run --cwd apps/docs build

      - name: Deploy documentation to Cloudflare
        run: bun run --cwd apps/docs wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
